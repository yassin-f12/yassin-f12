<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes waveScroll1 { from { transform: translateX(0); } to { transform: translateX(-1200px); } }
    @keyframes waveScroll2 { from { transform: translateX(0); } to { transform: translateX(-1200px); } }
    @keyframes floatY { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    @keyframes floatY2 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(12px); } }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.9; } }
    @keyframes drift { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(18px); } }
    .wave-back { animation: waveScroll1 9s linear infinite; }
    .wave-front { animation: waveScroll2 6s linear infinite; }
    .dot1 { animation: floatY 3.2s ease-in-out infinite; }
    .dot2 { animation: floatY2 3.8s ease-in-out infinite; }
    .dot3 { animation: floatY 2.6s ease-in-out infinite; }
    .dot4 { animation: floatY2 4.2s ease-in-out infinite; }
    .glyph1 { animation: drift 4s ease-in-out infinite, pulse 2.4s ease-in-out infinite; }
    .glyph2 { animation: drift 4.5s ease-in-out infinite, pulse 3s ease-in-out infinite; }
  </style>

  <rect x="0" y="0" width="1200" height="320" fill="url(#bg)"/>

  <g class="wave-back">
    <path d="M0 255 C 150 215, 300 285, 450 250 C 600 215, 750 285, 900 250 C 1050 215, 1150 255, 1200 240 L1200 320 L0 320 Z" fill="#1F6F5C" opacity="0.35"/>
    <path d="M1200 255 C 1350 215, 1500 285, 1650 250 C 1800 215, 1950 285, 2100 250 C 2250 215, 2350 255, 2400 240 L2400 320 L1200 320 Z" fill="#1F6F5C" opacity="0.35"/>
  </g>

  <g class="wave-front">
    <path d="M0 275 C 180 230, 330 300, 500 270 C 670 240, 820 300, 1000 270 C 1120 250, 1160 270, 1200 265 L1200 320 L0 320 Z" fill="#00E5A0" opacity="0.18"/>
    <path d="M1200 275 C 1380 230, 1530 300, 1700 270 C 1870 240, 2020 300, 2200 270 C 2320 250, 2360 270, 2400 265 L2400 320 L1200 320 Z" fill="#00E5A0" opacity="0.18"/>
  </g>

  <circle class="dot1" cx="130" cy="60" r="4" fill="#00E5A0" opacity="0.7"/>
  <circle class="dot2" cx="1075" cy="50" r="3" fill="#00E5A0" opacity="0.6"/>
  <circle class="dot3" cx="1000" cy="105" r="3" fill="#3B82F6" opacity="0.5"/>
  <circle class="dot4" cx="180" cy="130" r="2.5" fill="#8B949E" opacity="0.5"/>

  <text class="glyph1" x="90" y="90" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-size="22" fill="#00E5A0" opacity="0.6">&lt;/&gt;</text>
  <text class="glyph2" x="1040" y="190" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-size="22" fill="#3B82F6" opacity="0.6">{ }</text>

  <text x="600" y="150" text-anchor="middle" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-size="54" font-weight="700" fill="#00E5A0">Développeur Full Stack Web &amp; Mobile</text>
  <text x="600" y="190" text-anchor="middle" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-size="24" font-weight="400" fill="#fff">Recherche alternance — 12 mois</text>
  <text x="600" y="216" text-anchor="middle" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-size="18" font-weight="400" fill="#fff">Rythme : 3 semaines entreprise / 1 semaine école — CESI Lyon</text>
</svg>
